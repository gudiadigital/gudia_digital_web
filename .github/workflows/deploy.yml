# main dalına her push'ta siteyi derleyip GitHub Pages'e yayınlar,
# ardından içeriği değişen sayfaları IndexNow'a bildirir.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resubmit_all:
        description: "Sitemap'teki bütün adresleri IndexNow'a yeniden gönder"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; devam eden yayın iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Derleme içinde scripts/lastmod.mjs canlı sitedeki /lastmod.json ile
      # karşılaştırıp değişen adresleri .indexnow-urls.json'a yazıyor.
      - run: npm run build

      # Dosya yoksa boş liste: isteğe bağlı IndexNow adımı yayını durdurmasın.
      - id: changed
        run: echo "urls=$(cat .indexnow-urls.json 2>/dev/null || echo '[]')" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Yayından sonra çalışıyor ve hata verse bile yayını geri almıyor ya da
  # durdurmuyor (continue-on-error). Değişen sayfa yoksa hiç başlamıyor.
  # Google IndexNow'a katılmıyor; ona ping atılmıyor.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.urls != '[]' || inputs.resubmit_all
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Anahtar public/<anahtar>.txt'ten, alan adı public/CNAME'den okunuyor;
      # betik anahtar dosyası canlıda görünene kadar bekliyor (10 deneme,
      # 30 sn arayla).
      - run: node scripts/indexnow.mjs
        env:
          URLS: ${{ needs.build.outputs.urls }}
          RESUBMIT_ALL: ${{ inputs.resubmit_all && '1' || '' }}
